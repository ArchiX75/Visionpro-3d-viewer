name: Build visionOS → TestFlight

on:
  push:
    branches: [main, vibe/visionos-3d-viewer-7b9c77]
  workflow_dispatch:

jobs:
  build:
    name: Archive + upload TestFlight
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sélectionner Xcode 16
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          echo "Xcode utilisé : $XCODE_APP"
          sudo xcode-select --switch "$XCODE_APP/Contents/Developer"

      - name: Installer le certificat de distribution (si fourni)
        env:
          CERT_P12: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
          KEYCHAIN_PW: ${{ secrets.KEYCHAIN_PASSWORD }}
        if: ${{ env.CERT_P12 != '' }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo "$CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security import "$CERT_PATH" -k build.keychain -P "$KEYCHAIN_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

      - name: Archiver l'app visionOS
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_P12: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
        run: |
          SCHEME=$(xcodebuild -list | awk '/Schemes:/{getline; gsub(/^[ \t]+/,""); print; exit}')
          if [ -z "$SCHEME" ]; then
            echo "::error::Aucun scheme trouvé pour ce package SwiftPM"
            xcodebuild -list
            exit 1
          fi
          echo "Scheme utilisé : $SCHEME"
          SIGN_ARGS=()
          if [ -n "$TEAM_ID" ] && [ -n "$CERT_P12" ]; then
            echo "Signature équipe $TEAM_ID + entitlements iCloud"
            SIGN_ARGS+=(
              CODE_SIGN_STYLE=Automatic
              DEVELOPMENT_TEAM="$TEAM_ID"
              CODE_SIGN_ENTITLEMENTS=Visionpro3DViewer.entitlements
              -allowProvisioningUpdates
            )
          fi
          xcodebuild -scheme "$SCHEME" \
            -destination 'generic/platform=visionOS' \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Visionpro3DViewer.xcarchive" \
            "${SIGN_ARGS[@]}" \
            archive

      - name: Publier l'archive en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Visionpro3DViewer-xcarchive
          path: ${{ env.RUNNER_TEMP }}/Visionpro3DViewer.xcarchive
          retention-days: 7

      - name: Exporter l'IPA
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CERT_P12: ${{ secrets.DISTRIBUTION_P12_BASE64 }}
        if: ${{ env.TEAM_ID != '' && env.CERT_P12 != '' }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>destination</key>
              <string>upload</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Visionpro3DViewer.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload vers App Store Connect (TestFlight)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        if: ${{ env.ASC_KEY_ID != '' && env.ASC_ISSUER != '' && env.ASC_KEY_P8 != '' }}
        run: |
          mkdir -p "$HOME/.private_keys"
          echo "$ASC_KEY_P8" | base64 --decode > "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type xros \
            --file "$RUNNER_TEMP/export/"*.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER"
